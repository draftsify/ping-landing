<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ping — Catch the narrative before the market</title>
  <meta name="description" content="Real-time radar for the narratives, memes and cultural signals moving the memecoin market. Join the private beta." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ping — Catch the narrative before the market" />
  <meta property="og:description" content="Real-time radar for memecoin narratives. Join the private beta." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%232f6bff'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- full-screen video background -->
  <div class="bg" aria-hidden="true">
    <video id="bgvideo" class="bg__video" autoplay muted playsinline preload="auto" poster="assets/sky.png">
      <source src="assets/rise.mp4" type="video/mp4" />
    </video>
    <video id="bgvideo2" class="bg__video" muted playsinline preload="auto" poster="assets/sky.png" style="opacity:0">
      <source src="assets/rise.mp4" type="video/mp4" />
    </video>
    <div class="bg__scrim"></div>
  </div>

  <header class="topbar">
    <a href="#" class="brand" aria-label="ping home">
      <span class="brand__dot"></span><span class="brand__name">ping</span>
    </a>
    <a href="#" class="topbar__link">Follow updates <span aria-hidden="true">↗</span></a>
  </header>

  <main class="hero">
    <h1 class="hero__title appear" data-delay="0">Catch the narrative<br />before the market does.</h1>

    <div class="join appear" data-delay="1" id="join">
      <form class="waitlist" id="waitform" novalidate>
        <input id="wl-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="@yourhandle" aria-label="Your X handle" enterkeyhint="go" />
        <button type="submit" class="btn"><span class="btn__label">Join waitlist</span></button>
      </form>
    </div>

    <div class="success" id="success" hidden>
      <span class="check" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle class="check__c" cx="26" cy="26" r="23" /><path class="check__p" d="M15 27l7.5 7.5L38 19" /></svg>
      </span>
      <h2 class="success__title">You're on the list.</h2>
      <p class="success__sub">We'll ping <span id="success-who">you</span> the moment your invite is ready.</p>
    </div>
  </main>

  <footer class="foot">© 2026 ping · Not financial advice</footer>

  <!-- admin panel -->
  <div class="admin" id="admin" hidden>
    <div class="admin__panel">
      <div class="admin__head">
        <div class="admin__title"><span class="brand__dot"></span> Waitlist <span class="admin__count" id="admin-count">0</span></div>
        <button class="admin__close" id="admin-close" aria-label="Close">✕</button>
      </div>
      <div class="admin__tools">
        <input id="admin-search" class="admin__search" placeholder="Search signups…" autocomplete="off" />
        <button class="admin__act" id="admin-export">Export CSV</button>
        <button class="admin__act admin__act--danger" id="admin-clear">Clear</button>
      </div>
      <div class="admin__list" id="admin-list"></div>
      <div class="admin__foot" id="admin-foot"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
