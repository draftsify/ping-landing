<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ping · tokens</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dex.css" />
  <link rel="stylesheet" href="chatkit.css" />
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="index.html" aria-label="ping home">
      <img class="nav__logo" src="assets/logo-white.png" alt="" />
      <span>ping</span>
    </a>
    <nav class="nav__main">
      <a class="mtab" href="product.html">Assistant</a>
      <a class="mtab mtab--on" href="dex.html">Tokens</a>
    </nav>
    <div class="nav__right">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search token, symbol, chain…" autocomplete="off" />
      </div>
      <button class="iconbtn" id="refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <a class="ghost" href="index.html">Back to site ↗</a>
    </div>
  </header>

  <div class="subnav">
    <nav class="nav__tabs" id="views">
      <button class="ntab ntab--on" data-view="trending">Trending</button>
      <button class="ntab" data-view="gainers">Gainers</button>
      <button class="ntab" data-view="new">New</button>
      <button class="ntab" data-view="top">Top</button>
    </nav>
  </div>

  <main class="page">
    <div class="dex-scroll">
      <div class="dex">
        <div class="dex-head" id="dexHead">
          <div class="th th-token">Token</div>
          <div class="th th-num" data-sort="price">Price</div>
          <div class="th th-num" data-sort="age">Age</div>
          <div class="th th-num" data-sort="txns">Txns</div>
          <div class="th th-num" data-sort="vol">Volume</div>
          <div class="th th-num" data-sort="makers">Traders</div>
          <div class="th th-num" data-sort="c5">5M</div>
          <div class="th th-num" data-sort="c1">1H</div>
          <div class="th th-num" data-sort="c6">6H</div>
          <div class="th th-num" data-sort="c24">24H</div>
          <div class="th th-num" data-sort="liq">Liquidity</div>
          <div class="th th-num" data-sort="mcap">MCAP</div>
        </div>
        <div id="rows"></div>
      </div>
    </div>

    <div class="state" id="state">
      <div class="spinner"></div>
      <span>Loading live pairs from DexScreener…</span>
    </div>
    <p class="foot" id="foot"></p>
  </main>

  <!-- floating AI assistant -->
  <div class="asst" id="asst">
    <button class="asst__bear" id="asstBear" aria-label="Ask ping AI">
      <img class="asst__svg" src="assets/bear.svg" alt="ping AI" />
    </button>

    <section class="cx" id="asstChat" hidden aria-label="ping AI chat">
      <div class="cx__head">
        <div class="cx__id">
          <span class="cx__ava"><img src="assets/bear.svg" alt="" /></span>
          <div><b>ping</b><em>thesis desk</em></div>
        </div>
        <button class="cx__close" id="asstClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="cx__thread" id="cxThread">
        <div class="cx__msgs" id="cxMsgs"></div>
      </div>
      <div class="cx__chips" id="cxChips">
        <button class="cx__chip" data-tpl="Rate my thesis and tell me what I'm missing:\n\n">Rate my thesis</button>
        <button class="cx__chip" data-tpl="Break down this narrative and how fast it's spreading:\n\n">Break a narrative</button>
        <button class="cx__chip" data-tpl="What's the momentum on $">Check a ticker</button>
      </div>
      <div class="cx__opts">
        <div class="lentoggle" id="cxLen" title="Answer length">
          <button type="button" class="lenbtn lenbtn--on" data-len="short">Short</button>
          <button type="button" class="lenbtn" data-len="long">Long</button>
        </div>
      </div>
      <form class="cx__box" id="cxForm">
        <textarea id="cxInput" rows="1" placeholder="Ask about a token, a narrative, an X link…"></textarea>
        <button type="submit" class="cx__send" id="cxSend" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </section>
  </div>

  <script src="chatkit.js"></script>
  <script src="dex.js"></script>
</body>
</html>
